project_id = "vzvbcewvdqcerogwsjeu"

[auth]
site_url = "https://www.gostodumatu.com.br"
additional_redirect_urls = [
  "https://www.gostodumatu.com.br/auth/callback",
  "https://gostodumatu.com.br/auth/callback",
  "https://gostudumatu.vercel.app/auth/callback",
  "http://127.0.0.1:8080/auth/callback",
  "http://localhost:8080/auth/callback",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1m"
otp_length = 8

[auth.rate_limit]
email_sent = 30

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage.vector]
enabled = false

[functions.create-producer]
verify_jwt = true

[functions.migrate-catalog-images]
verify_jwt = true

[functions.melhor-envio-oauth]
verify_jwt = false

[functions.shipping-quotes]
verify_jwt = true

[functions.checkout-session]
verify_jwt = true

[functions.process-payment]
verify_jwt = true

[functions.mercadopago-webhook]
verify_jwt = false

[functions.fulfillment-worker]
verify_jwt = true
